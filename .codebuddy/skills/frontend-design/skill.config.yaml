# Skill Configuration for frontend-design
# ── 触发与优先级 ──
priority: 80
auto-trigger: true
trigger-keywords:
    - 前端设计
    - 前端架构设计
    - 设计前端方案
    - 组件拆分设计
    - 路由设计
    - 数据流方案
    - 前端模块设计
    - 架构方案设计
    - 技术方案设计
    - 前端技术选型
    - 前端性能策略
    - 模块边界设计
    - 代码架构设计
    - 红线约束
    - 耦合分析
    - 模块化设计

# ── 依赖关系 ──
# v6: 去掉 specflow-rules-engine，规则由 ADS reads + rulesInline 内联
# 被 frontend-codegen anchor "design" 调用时，RULE.mdc 由引擎读取后内联进指令
depends-on: []
mutual-exclude: [admin-ui-design]
require-tools:
    [read_file, search_content, search_file, list_dir, RAG_search]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 360

# ── ADS Harness 集成 ──
# 本 skill 是 frontend-codegen ADS harness 的 design anchor 子 skill
# 规则注入：ADS reads → RULE.mdc → rulesInline 内联进指令 JSON
# 门禁验证：ADS verify → schema 校验 frontendPlan 4 张表
# 状态管理：ADS anchor-state.json（design 阶段状态由引擎管理）
# 断线恢复：nut ads status 随时查看当前进度

# ── 触发权重 ──
trigger-weight:
    前端架构设计: 95
    前端设计: 90
    架构设计: 90
    组件拆分设计: 85
    前端模块设计: 85
    模块化设计: 85
    路由设计: 80
    数据流方案: 80
    技术方案设计: 75
    耦合分析: 75
    红线约束: 70
