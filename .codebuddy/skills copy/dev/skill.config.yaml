---
name: dev
version: 5.0.0
category: flow
phase: all
dependencies:
  required:
    - specflow-rules-engine
    - frontend-codegen
    - node-backend-codegen
    - backend-trpc-codegen
    - eslint-code-quality
  conditional:
    - admin-ui-design
    - frontend-design
    - backend-design
  mcp:
    - specflow-cognitive-engine
    - specflow-context-broker
    - specflow-impact-analyzer
    - specflow-memory-engine
    - specflow-knowledge-engine
conflict_with:
  - fix
  - resume
skip_conditions:
  admin-ui-design:
    - 纯后端代码（只改 electron/）
    - 纯类型定义（只改 src/types/）
    - 纯逻辑修复（只改 .ts 非组件文件）
    - 配置文件修改
  frontend-design:
    - 单文件修改 ≤30 行
    - 纯样式调整（只改 .scss）
    - 纯后端代码
    - 纯类型定义
    - 用户已有明确技术方案
