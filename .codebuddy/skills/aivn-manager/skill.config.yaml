# Skill Configuration for aivn-manager
# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
    - 初始化版本管理
    - 设置版本管理
    - aivn init
    - 保存版本
    - 记录一下
    - 看看改了什么
    - 回滚
    - 恢复代码
    - 对比版本
    - 会话管理
    - 版本历史
    - 快照
    - 创建会话
    - 切换会话
    - 查看历史记录
    - 部署hooks
    - 配置hooks
    - 初始化hooks
    - 自动记录

# ── 依赖关系 ──
depends-on: []
mutual-exclude: []
require-tools: [read_file, execute_command, write_to_file]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 120

# ── 触发权重 ──
trigger-weight:
