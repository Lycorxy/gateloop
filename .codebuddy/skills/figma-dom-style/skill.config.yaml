# figma-dom-style skill configuration (v2.0)

skill:
  name: figma-dom-style
  version: 2.0.0
  description: |
    Figma 设计稿全流程还原：布局分析 + DOM+Style DSL 输出 + 像素验证。
    v2.0: 自适应三级拆分（Page→Region→Component）+ 策略级联（A→B→C 必定达标）+ 局部验证 + 快照回退 + GATE 硬阻断。

# MCP 工具依赖
mcp:
  server: figma-trimly
  required_tools:
    - figma_baseline_compare    # Step 1: 获取基准材料
    - figma_to_html             # Step 1: 获取基线 HTML
    - figma_to_interaction_dsl  # Step 2: 获取交互标注
    - figma_compare_html_file   # Step 3/4/5: 渲染 + 对比（核心）
  optional_tools:
    - parse_figma_url           # 解析 URL
    - figma_to_dsl              # 备用: Figma → DSL
    - dsl_to_html               # 备用: DSL → HTML
    - html_to_image             # 备用: HTML → PNG
    - compare_image_files       # 备用: 图片对比
    - figma_compare_dsl_file    # 备用: DSL 文件对比
    - calc_spacing              # 间距计算
    - compress_image            # 图片压缩

# 临时目录策略
temp_dir: .trimly/tmp/{fileKey}_{nodeId}/

# 迭代限制
limits:
  max_iterations: 5
  target_similarity: 95
  diminishing_returns_threshold: 0.3
  strategy_a_threshold: 1.0
  strategy_b_threshold: 0.5
  strategy_c_threshold: 0.3

# v2.0 策略级联
strategy_cascade:
  enabled: true
  strategies:
    A:
      name: "纯 Flex/Grid 语义化"
      max_rounds: 2
      local_diff_threshold: 1.0
    B:
      name: "混合模式（Flex + Absolute 精确子元素）"
      max_rounds: 2
      local_diff_threshold: 0.5
    C:
      name: "基线片段复用"
      max_rounds: 1
      local_diff_threshold: 0.3
  auto_escalate: true
  fallback_guaranteed: true  # 策略 C 必定达标

# v2.0 自适应拆分
adaptive_decomposition:
  enabled: true
  trigger_conditions:
    - "策略 A 连续 2 轮 local diff >= 1%"
    - "Region 内有 3+ 独立组件"
    - "Region diff > 2% 且已尝试 2 轮"
  decomposed_status: "decomposed"  # 替代 blocked

# 参考文档
references:
  - path: references/task-queue-guide.md
    load_at: Step 3
    version: "2.0"
    description: "v2.0 步骤管理器核心：三级拆分 + 策略级联 + 局部验证 + 快照回退 + GATE"
  - path: references/optimization-strategy.md
    load_at: Step 3
  - path: references/dsl-format-guide.md
    load_at: Step 2
  - path: references/layout-analysis.md
    load_at: Step 2
  - path: references/css-technique-library.md
    load_at: Step 2/3
  - path: references/icon-asset-management.md
    load_at: Step 2/3

# 禁止行为
forbidden:
  - generate_script_files       # .cjs/.js/.mjs/.ts
  - use_node_e_inline_scripts   # node -e "..."
  - manual_playwright_screenshot
  - manual_pixelmatch_compare
  - output_wireframe_placeholder # 框线图/占位符/skeleton
  - split_render_and_compare     # 不要拆成 html_to_image + compare_image_files
  # v12.2 新增
  - keep_absolute_for_alignment  # 禁止以"对齐精度"为由保留 absolute（铁律 3a）
  - blind_iteration              # 禁止不验证就继续修改（铁律 6a）
  - keep_redundant_elements      # 禁止保留冗余元素（铁律 6b：统计 Switch/重复 indicator/placeholder）

# v12.2 新增：绝对定位转换检查
absolute_conversion:
  required: true                 # iter-{N}.html 中 absolute 节点必须为 0（除例外场景）
  exceptions:
    - highlight_rects_overlay    # 对话区高亮叠层（rects z-index:0-6 + 文字 z-index:7）
    - decorator_elements         # decorator 装饰元素
    - icon_offset_in_clip        # 图标在裁剪框内的偏移
    - switch_dot_offset          # Switch 圆点在轨道内的偏移
  checklist:
    - root_container_flex        # root 容器 display:flex
    - sidebar_main_flex_item     # sidebar/main 是 flex item
    - tab_bar_flex_row           # tab-bar 是 flex-row
    - dual_panel_flex_row        # dual-panel 是 flex-row
    - panel_cards_flex_column    # panel 内卡片是 flex-column + gap
    - card_inner_flex            # 卡片内部元素是 flex
    - footer_flex_row            # footer 是 flex-row + space-between
    - exceptions_documented      # 例外场景在 layout-plan.json 中记录
