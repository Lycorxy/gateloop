# ── 触发与优先级 ──
priority: 80 # 与 frontend-codegen 同级
auto-trigger: true # 关键词匹配时自动激活
trigger-keywords:
    - 生成后端代码
    - 生成Go服务
    - 生成tRPC接口
    - 生成proto
    - 生成CRUD后端
    - 从需求生成Go代码
    - 生成Kafka消费代码
    - 写tRPC三层架构
    - 后端代码生成

# ── 依赖关系 ──
depends-on:
    - specflow-rules-engine # 前置规则注入
    - mysql-schema-design # 表设计子Skill（按需委派）
mutual-exclude: [] # 无互斥

# ── 生命周期 ──
load-strategy: lazy # 触发时加载
unload-after-run: true # 执行后释放上下文
max-duration: 300 # 超时秒数（全流程较长）

# ── 触发权重（用于冲突解决）──
trigger-weight:
    生成后端代码: 90
    生成Go服务: 85
    生成tRPC接口: 80
    生成CRUD: 75
    生成proto: 70
    从需求生成Go代码: 85
