name: web-ui-design
description: >
  Web 端 UI 设计技能（含管理系统/B端/C端/工具型产品）。
  覆盖：布局决策评估、交互方案对比、信息层级设计、视觉层次、间距系统、
  色彩Token、组件组合、全状态覆盖、强制设计检测（布局/交互/间距/体验）。
  核心理念：设计即取舍——同一功能 N 种方案，通过量化评估选出最优解。
  触发词：设计页面、设计布局、设计组件、优化UI、美化界面、设计面板、
  设计表格/表单/列表页、设计仪表盘、设计工具栏、设计弹窗、设计侧边栏。
  不要用于：纯后端开发、纯CSS编写（→ css-style-writer）、纯前端代码逻辑。
triggers:
  - 设计*页面
  - 设计*布局
  - 设计*组件
  - 设计*面板
  - 优化*UI
  - 美化*界面
  - 设计*表格
  - 设计*表单
  - 设计*仪表盘
  - 设计*工具栏
  - UI设计
  - 交互设计
  - 布局设计
version: 2.0.0
