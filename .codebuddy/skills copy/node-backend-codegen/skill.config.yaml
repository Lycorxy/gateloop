# Skill Configuration Template

# ── Trigger & Priority ──
priority: 80
auto-trigger: true
trigger-keywords:
    - 生成 Node 代码
    - 写后端模块
    - 写 CLI 工具
    - 新增 helper
    - 写 TS 后端代码
    - Node 脚本
    - Node 后端
    - node: 导入
    - createRequire
    - Node.js 代码生成
    - 后端代码

# ── Dependencies ──
depends-on: [specflow-rules-engine, eslint-code-quality]
mutual-exclude: [frontend-codegen, backend-trpc-codegen]
require-tools: [read_file, write_file, search_content, execute_command, use_skill]

# ── Lifecycle ──
load-strategy: lazy
unload-after-run: true
max-duration: 300

# ── Trigger Weights ──
trigger-weight:
    生成 Node 代码: 95
    写后端模块: 90
    写 CLI 工具: 85
    新增 helper: 85
    写 TS 后端代码: 90
    Node 脚本: 80
    Node 后端: 85
    'node: 导入': 75
    createRequire: 75
    Node.js 代码生成: 90
    后端代码: 70
