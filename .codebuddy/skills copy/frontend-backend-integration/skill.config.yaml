# ── 触发与优先级 ──
priority: 70
auto-trigger: true
trigger-keywords:
    - 前后端联调
    - 接口对接
    - mock替换
    - 接入真实接口
    - API对接
    - 联调
    - 替换mock
    - 接口联调

# ── 依赖关系 ──
depends-on: []
mutual-exclude: []
require-tools: [read_file, write_file, replace_in_file, search_content, search_file, list_dir]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 300

# ── 触发权重 ──
trigger-weight:
    前后端联调: 95
    接口对接: 90
    mock替换: 85
    接口联调: 85
    接入真实接口: 80
    联调: 70
