# Skill Configuration for mysql-schema-design
priority: 90
auto-trigger: true
trigger-keywords:
    # 正向触发词
    - 建表
    - 设计表
    - MySQL表结构
    - schema设计
    - DDL
    - 数据库表设计
    - 表结构设计
    - 分库分表
    - 索引设计
    - 字段设计
    - 新增表
    - 创建表
    # 反向排除
depends-on: [specflow-rules-engine]
mutual-exclude: []
require-tools: [read_file, search_content, execute_command, list_dir]
load-strategy: lazy
unload-after-run: true
max-duration: 180
trigger-weight:
    建表: 95
    设计表: 95
    MySQL表结构: 92
    schema设计: 88
    DDL: 85
    数据库表设计: 90
    分库分表: 80
    索引设计: 78
