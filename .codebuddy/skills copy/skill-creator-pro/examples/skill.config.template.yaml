# Skill 配置模板
# 将此文件复制到 skill-name/skill.config.yaml（每个 skill 一份）

# ── 触发与优先级 ──
priority: 80
auto-trigger: true
trigger-keywords:
    - keyword1
    - keyword2
    - keyword3

# ── 依赖关系 ──
depends-on: []
mutual-exclude: []
require-tools: [read_file]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 120

# ── 触发权重 ──
trigger-weight:
    keyword1: 90
    keyword2: 80
    keyword3: 50
