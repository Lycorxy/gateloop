# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
  - 写样式
  - 写CSS
  - 写SCSS
  - 写style
  - 添加样式
  - 样式的修改
  - 修改样式
  - 组件样式
  - 样式生成
  - 添加样式代码
  - 风格
  - style
  - scss
  - css module
  - module.scss
  - 样式文件
  - 样式组件
  - 最优CSS
  - 最少代码
  - 样式优化
  - CSS设计
  - 扁平样式

# ── 依赖关系 ──
# v7: 去掉 specflow-rules-engine，规则由 ADS reads + rulesInline 内联
# 被 frontend-codegen anchor "code" 调用时，RULE.mdc 由引擎读取后内联
depends-on: []
mutual-exclude: [admin-ui-design]
require-tools: [read_file, write_file, replace_in_file, search_content, execute_command]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 300

# ── 触发权重 ──
trigger-weight:
  写样式: 95
  写SCSS: 95
  写CSS: 95
  CSS: 90
  scss: 90
  最优CSS: 92
  样式优化: 88
  CSS设计: 88
  扁平样式: 85
  样式: 85
  style: 80
  样式修改: 85
  样式生成: 85
  组件样式: 85
  样式文件: 80
  最少代码: 75
