# Skill Configuration

# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
    - 需求澄清
    - 梳理需求
    - 分析需求
    - 明确需求
    - 需求评审
    - 帮我理清思路
    - 这个功能怎么做
    - PRD 评审
    - 需求文档
    - 帮我分析

# ── 依赖关系 ──
depends-on: [specflow-rules-engine]
mutual-exclude: [frontend-codegen, node-backend-codegen, backend-trpc-codegen]
require-tools: [read_file, write_file, search_content, execute_command, use_skill]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 600

# ── 触发权重 ──
trigger-weight:
    需求澄清: 95
    梳理需求: 90
    分析需求: 85
    明确需求: 90
    需求评审: 85
    帮我理清思路: 80
    帮我分析: 80
    PRD 评审: 85
    需求文档: 75
