name: frontend-codegen
version: 6.0.0
description: "前端代码生成唯一入口，编排子技能委派样式/联调任务"
triggers:
  positive:
    - "生成前端代码"
    - "创建组件"
    - "写tsx"
    - "新建页面"
    - "代码生成"
    - "修改组件"
    - "拆分组件"
    - "前端开发"
  negative:
    - "纯CSS设计"        # → css-style-writer
    - "只写样式"          # → css-style-writer
    - "前后端联调"        # → frontend-backend-integration
    - "接口对接"          # → frontend-backend-integration
    - "mock替换"          # → frontend-backend-integration
    - "设计后台布局"      # → admin-ui-design
    - "后端开发"          # → 不属于前端
conflicts:
  - admin-ui-design       # 布局设计走专门 Skill
dependencies:
  - specflow-rules-engine
  - eslint-code-quality
  - css-style-writer
  - frontend-backend-integration
