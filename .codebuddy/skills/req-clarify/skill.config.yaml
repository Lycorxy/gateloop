# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
    - 需求分析
    - 需求澄清
    - 分析需求
    - 梳理需求
    - 这个功能怎么做
    - 帮我理清思路
    - 需求评审
    - PRD 评审
    - 需求文档
    - 帮我分析

# ── 依赖关系 ──
# 🔒 depends-on 必须包含 specflow-rules-engine（规则注入引擎）
depends-on:
    - specflow-rules-engine
mutual-exclude: [frontend-codegen, node-backend-codegen, backend-trpc-codegen]
require-tools: [read_file, write_file, replace_in_file, search_content, search_file, list_dir, execute_command]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 600

# ── 触发权重 ──
trigger-weight:
    需求分析: 95
    需求澄清: 95
    分析需求: 90
    梳理需求: 85
    这个功能怎么做: 85
    帮我理清思路: 80
    需求评审: 85
    PRD 评审: 85
    需求文档: 75
    帮我分析: 80

# ── MCP 能力声明（编排器探测用，skill 不直接读取）──
# Step 1 上下文探测需要 MCP 提供项目上下文/历史记忆/设计规范
# 无 MCP 时通过 step-contracts.providers 降级链兜底（内置 list_dir/search_content）
mcp-capabilities:
    - server: "knowledge-base"          # 知识库 MCP：项目上下文、设计规范
      optional: true                    # true=有则用，无则降级内置工具
    - server: "memory-store"            # 记忆 MCP：历史决策、踩坑记录
      optional: true

# ── 数据契约（step-contracts）──
# Step 1 上下文探测需要外部数据，通过契约声明获取方式
# providers 链：MCP 存在时必调用，不存在时降级内置工具
# 详见 skill-creator-pro/references/contract-pattern.md
step-contracts:
    # Step 1 契约 1：项目代码上下文（硬依赖，缺则阻断）
    - id: project-context
      step: "1"
      name: "获取项目代码上下文"
      criticality: required             # 硬依赖：无上下文无法基于事实分析
      input:
          target_dirs: "目标探测目录 (src/, .codebuddy/, backend/)"
      output:
          tech_stack: "技术栈"
          route_structure: "路由结构"
          data_models: "数据模型清单"
          component_inventory: "组件库清单"
          api_layer: "API 层清单"
          reusable_helpers: "可复用函数清单"
          design_specs: "设计规范"
      providers:
          - mcp:                        # 优先级 1：MCP（存在时必调用，更全+带记忆）
              server: "knowledge-base"
              tool: "get_context"
              params:
                  dirs: "{input.target_dirs}"
          - builtin:                    # 优先级 2：内置工具降级（当前主路径）
              strategy: "list_dir + search_content + search_file"
              description: "探测目录结构/路由/数据模型/组件/API/helpers/知识库"
          - fallback: "ask-user"        # 优先级 3：最终降级
      on-missing: block                 # 硬依赖：无法获取则阻断

    # Step 1 契约 2：历史决策记忆（软依赖，本地可兜底）
    - id: historical-decisions
      step: "1"
      name: "获取同类需求历史决策与踩坑"
      criticality: preferred            # 软依赖：有则参考，无则用通用经验
      input:
          requirement_keywords: "需求关键词"
      output:
          past_decisions: "历史决策记录"
          pitfalls: "历史踩坑记录"
      providers:
          - mcp:                        # 优先级 1：MCP 记忆库
              server: "memory-store"
              tool: "recall"
              params:
                  query: "{input.requirement_keywords}"
          - fallback: "local"           # 优先级 2：本地兜底
      on-missing: degrade               # 软依赖：降级继续
      degrade-source: "references/analysis-checklist.md"

# ── 记忆钩子（可选）──
# 需求分析的关键决策存入记忆，供后续 skill（设计/代码生成）复用
# skill 正文不感知这些钩子，仅在此声明
memory-hooks:
    on-step-complete:
        - event: "gap-analysis-done"           # Step 3 差距分析完成
          mcp-store:
              server: "memory-store"
              tool: "save_memory"
    on-skill-end:
        - event: "requirement-spec-output"     # Step 5 需求规格输出
          mcp-store:
              server: "memory-store"
              tool: "save_session"
