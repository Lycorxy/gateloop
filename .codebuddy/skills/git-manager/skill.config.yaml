# Skill Configuration for git-manager
# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
  - git add
  - git commit
  - 暂存
  - 提交代码
  - 回退
  - 撤销
  - 查看差异
  - 切换分支
  - stash
  - 修复换行符
  - ssh
  - 安全网
  - 配置文件
  - 创建分支
  - 提交记录
  - 工作区
  - 行为日志
  - 操作历史
  - undo
  - rollback
  - activity
  - rebase
  - 合并到test
  - mergeToTest
  - 创建MR
  - createMR
  - 打tag
  - flow create
  - feature分支
  - hotfix分支
  - 项目配置
  - gitignore
  - editorconfig
  - gitattributes
  - 多帐号SSH
  - SSH诊断
  - 快照
  - snapshot

# ── 依赖关系 ──
depends-on: []
mutual-exclude: []
require-tools: [read_file, execute_command, search_content]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 120

# ── 触发权重 ──
trigger-weight:
  暂存: 95
  提交代码: 95
  回退: 92
  撤销: 92
  rollback: 90
  undo: 90
  查看差异: 88
  行为日志: 87
  activity: 85
  stash: 85
  合并到test: 85
  mergeToTest: 85
  创建MR: 83
  createMR: 83
  打tag: 80
  flow create: 80
  rebase: 78
  创建分支: 75
  切换分支: 75
  修复换行符: 72
  项目配置: 70
  gitignore: 68
  ssh: 65
  安全网: 60
  快照: 60
  snapshot: 60
  多帐号SSH: 58
  SSH诊断: 55
