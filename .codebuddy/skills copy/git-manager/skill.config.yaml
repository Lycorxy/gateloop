# Skill Configuration for git-manager
# ── 触发与优先级 ──
priority: 80
auto-trigger: true
trigger-keywords:
  - git add
  - git commit
  - 暂存
  - 提交代码
  - 回退
  - 查看差异
  - 切换分支
  - stash
  - 修复换行符
  - ssh
  - 安全网
  - 配置文件
  - 创建分支
  - 提交记录
  - 工作区

# ── 依赖关系 ──
depends-on: []
mutual-exclude: []
require-tools: [read_file, execute_command]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 120

# ── 触发权重 ──
trigger-weight:
  暂存: 95
  提交代码: 95
  回退: 90
  查看差异: 85
  stash: 85
  创建分支: 75
  切换分支: 75
  修复换行符: 70
  ssh: 65
  安全网: 60
