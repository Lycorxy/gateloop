# ── 触发与优先级 ──
priority: 85
auto-trigger: true
trigger-keywords:
    - 生成前端代码
    - 创建组件
    - 写tsx
    - 新建页面
    - 代码生成
    - 修改组件
    - 拆分组件
    - 前端开发

# ── 依赖关系 ──
# v11: 去掉 specflow-rules-engine，改用 ADS harness 驱动流程+内联规则
depends-on: [code-quality-guard, css-style-writer, frontend-design]
mutual-exclude: [admin-ui-design]
require-tools:
    [read_file, write_file, replace_in_file, search_content, search_file, execute_command, list_dir]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 600
max-token: 8000

# ── ADS Harness 配置 ──
# 流程由 anchor.config.json 驱动，不再依赖 specflow-rules-engine
# 规则注入：ADS reads + rulesInline 内联（引擎读文件后塞进指令 JSON）
# 门禁验证：ADS verify exit code 强制（模型无法谎报通过）
# 阶段间数据：ADS emits/consumes artifact（引擎自动内联上游数据）
# 断线恢复：nut ads status 随时查看当前 anchor

# ── 触发权重 ──
trigger-weight:
    生成前端代码: 95
    创建组件: 90
    写tsx: 85
    新建页面: 85
    代码生成: 90
    修改组件: 85
    拆分组件: 80
    前端开发: 75
