priority: 80
auto-trigger: true
trigger-keywords:
  - 继续上次
  - 接着做
  - 恢复任务
  - 断点继续
  - 上次的
  - 继续任务
  - 接着

depends-on: []
mutual-exclude: [dev, fix, archive]
require-tools: [read_file, write_file, search_content, execute_command, use_skill, mcp_call_tool]

load-strategy: lazy
unload-after-run: true
max-duration: 300

trigger-weight:
  继续上次: 95
  接着做: 90
  恢复任务: 95
  断点继续: 95
  上次的: 85
  继续任务: 90
  接着: 70
