---
name: fix
version: 5.0.0
category: flow
phase: any
dependencies:
  required:
    - specflow-rules-engine
    - eslint-code-quality
  conditional:
    - admin-ui-design
    - frontend-design
    - frontend-codegen
    - node-backend-codegen
  mcp:
    - specflow-cognitive-engine
    - specflow-context-broker
    - specflow-impact-analyzer
    - specflow-memory-engine
conflict_with:
  - dev
  - resume
skip_conditions:
  admin-ui-design:
    - 纯后端 bug
    - 纯逻辑 bug
    - 纯类型修复
    - 配置/脚本 bug
    - 样式类名错配（语义修复，非视觉重设）
  frontend-design:
    - ≤1 文件修改 && ≤30 行
    - 纯样式修复（只改 .scss）
    - 纯后端修复
    - 纯类型修复
    - 已有同问题 INCIDENT 记忆
