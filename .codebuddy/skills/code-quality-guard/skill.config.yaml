# ── 触发与优先级 ──
priority: 90
auto-trigger: true
trigger-keywords:
    - 代码规范
    - lint check
    - ESLint
    - Stylelint
    - Prettier
    - 代码检查
    - 格式化
    - 修复lint
    - 类型检查
    - tsc
    - ts错误
    - 初始化规则
    - 规则知识库
    - 代码质量
    - prettier格式化
    - 代码格式

# ── 依赖关系 ──
# v12: 去掉 specflow-rules-engine，规则由 ADS reads + rulesInline 内联
# 被 frontend-codegen anchor "code" 调用时，RULE.mdc 由引擎读取后内联
depends-on: []
mutual-exclude: [code-review-check]
require-tools:
    [read_file, write_file, replace_in_file, search_content, search_file, execute_command, list_dir]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 300

# ── ADS Harness 集成 ──
# 本 skill 是 frontend-codegen ADS harness 的子 skill
# anchor "code": 前置调用任务1+2（规则提取+注入），编码后调用任务3（验证修复闭环）
# 规则注入：ADS reads → RULE.mdc → rulesInline 内联进指令 JSON
# 门禁验证：ADS verify → tsc + lint exit code 强制（stylelint 按需触发，仅项目有配置时跑）
# 状态管理：ADS anchor-state.json（code 阶段状态由引擎管理）
# 断线恢复：nut ads status 随时查看当前进度

# ── 触发权重 ──
trigger-weight:
    代码规范: 95
    lint check: 90
    ESLint: 90
    代码检查: 85
    格式化: 85
    Prettier: 85
    修复lint: 85
    类型检查: 85
    prettier格式化: 85
    ts错误: 80
    tsc: 75
    初始化规则: 70
    规则知识库: 65
    代码格式: 65
    代码质量: 55
